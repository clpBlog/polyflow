<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#701c2d" />
    <meta
      name="description"
      content="PolyFlow 将 Canvas 作业、课程资料与 Outlook 邮件聚合到一个中文优先的学习工作台。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/polyu-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/polyu-logo.png" />
    <link rel="stylesheet" href="./styles.css?v=16" />
    <title>PolyFlow · 学习工作台</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="m3 11 9-8 9 8" /><path d="M5 10v10h14V10" /><path d="M9 20v-6h6v6" />
      </symbol>
      <symbol id="i-task" viewBox="0 0 24 24">
        <path d="M9 5h11" /><path d="M9 12h11" /><path d="M9 19h11" />
        <path d="m3 5 1.2 1.2L6.5 4" /><path d="m3 12 1.2 1.2L6.5 11" /><path d="m3 19 1.2 1.2L6.5 18" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24">
        <rect width="18" height="14" x="3" y="5" rx="3" /><path d="m3 7 9 6 9-6" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" />
      </symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" /><path d="M10 21h4" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14" /><path d="m13 6 6 6-6 6" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect width="18" height="17" x="3" y="4" rx="3" /><path d="M8 2v4M16 2v4M3 9h18" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-translate" viewBox="0 0 24 24">
        <path d="M4 5h8M8 3v2c0 4-2 7-5 9" /><path d="M6 9c1 2 3 4 6 5" />
        <path d="m13 21 4-10 4 10M14.5 18h5" />
      </symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24">
        <path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3Z" />
        <path d="m5 14 .8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8L5 14ZM19 13l.7 1.8 1.8.7-1.8.7L19 18l-.7-1.8-1.8-.7 1.8-.7L19 13Z" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1" />
        <path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" /><path d="M14 2v6h6M8 13h8M8 17h5" />
      </symbol>
      <symbol id="i-video" viewBox="0 0 24 24">
        <rect width="14" height="14" x="2" y="5" rx="3" /><path d="m16 10 6-3v10l-6-3" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
      </symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4V3Z" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none" /><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none" /><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-command" viewBox="0 0 24 24">
        <path d="M18 9a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12Z" />
      </symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24">
        <path d="M17.5 19H7a5 5 0 1 1 1.5-9.8A6 6 0 0 1 20 12a3.5 3.5 0 0 1-2.5 7Z" />
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#home" aria-label="PolyFlow 首页">
          <img
            class="brand-mark"
            src="./assets/polyu-logo.png"
            alt=""
            width="40"
            height="40"
            aria-hidden="true"
            draggable="false"
          />
          <span class="brand-copy">
            <strong>PolyFlow</strong>
            <small>学习工作台</small>
          </span>
        </a>

        <nav class="side-nav">
          <p class="nav-label">工作台</p>
          <a class="nav-item" href="#home" data-route="home">
            <svg><use href="#i-home"></use></svg><span>今日总览</span>
          </a>
          <a class="nav-item" href="#assignments" data-route="assignments">
            <svg><use href="#i-task"></use></svg><span>作业与测验</span><span class="nav-count" id="assignment-count">3</span>
          </a>
          <a class="nav-item" href="#materials" data-route="materials">
            <svg><use href="#i-book"></use></svg><span>课程资料</span>
          </a>
          <a class="nav-item" href="#inbox" data-route="inbox">
            <svg><use href="#i-mail"></use></svg><span>邮件收件箱</span><span class="nav-count accent" id="mail-count">2</span>
          </a>
          <p class="nav-label nav-label-spaced">空间</p>
          <button class="nav-item nav-button" id="open-calendar">
            <svg><use href="#i-calendar"></use></svg><span>学习日历</span>
          </button>
          <a class="nav-item" href="#settings" data-route="settings">
            <svg><use href="#i-settings"></use></svg><span>连接与设置</span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <div class="sync-state">
            <span class="sync-dot"></span>
            <span><strong>演示数据</strong><small>刚刚更新</small></span>
          </div>
          <button class="profile-card" id="profile-button" aria-label="打开个人信息">
            <span class="avatar" id="sidebar-avatar">同</span>
            <span class="profile-copy"><strong id="sidebar-name">同学</strong><small id="sidebar-subtitle">自托管学习空间</small></span>
            <svg><use href="#i-more"></use></svg>
          </button>
        </div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <button class="icon-button mobile-only" id="mobile-menu-button" aria-label="打开菜单">
            <span class="hamburger"></span>
          </button>
          <button class="search-trigger" id="search-trigger" aria-label="全局搜索">
            <svg><use href="#i-search"></use></svg>
            <span>搜索作业、课件、邮件...</span>
            <kbd><span>⌘</span> K</kbd>
          </button>
          <div class="topbar-actions">
            <button class="icon-button notification-button" id="notification-button" aria-label="通知">
              <svg><use href="#i-bell"></use></svg><span class="notification-dot"></span>
            </button>
            <button class="avatar avatar-button" id="top-profile" aria-label="个人信息">同</button>
          </div>
        </header>

        <main id="main-content" class="main-content" tabindex="-1">
          <div id="page-view"></div>
        </main>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="手机端主导航">
      <a href="#home" data-route="home"><svg><use href="#i-home"></use></svg><span>首页</span></a>
      <a href="#assignments" data-route="assignments"><svg><use href="#i-task"></use></svg><span>作业</span></a>
      <a href="#materials" data-route="materials"><svg><use href="#i-book"></use></svg><span>资料</span></a>
      <a href="#inbox" data-route="inbox"><svg><use href="#i-mail"></use></svg><span>收件箱</span></a>
      <button id="mobile-search"><svg><use href="#i-search"></use></svg><span>搜索</span></button>
    </nav>

    <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="overlay-root"></div>

    <script src="./app.js?v=16"></script>
  </body>
</html>
